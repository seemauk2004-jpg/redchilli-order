<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Red Chilli POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first POS — top bar, scrolling work area, bottom tab bar; cart becomes a side panel at tablet width */
:root{
  --bg:#F7F4F3; --panel:#FFFFFF; --ink:#251A18; --muted:#7A6A66; --line:#E6DDDA;
  --chilli:#C8102E; --chilli-ink:#FFFFFF; --chilli-soft:#FBE3E6; --amber:#E39B0B; --amber-soft:#FFF1D6;
  --ok:#1F8A4C; --ok-soft:#DFF3E7; --warn:#B86E00; --bad:#B3261E;
  --veg:#1F8A4C; --nonveg:#B3261E;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171211; --panel:#221B19; --ink:#F3ECEA; --muted:#A8958F; --line:#3A2F2C;
  --chilli:#E8354F; --chilli-ink:#FFFFFF; --chilli-soft:#3D1A1F; --amber:#F2B23A; --amber-soft:#3A2C10;
  --ok:#4CC27F; --ok-soft:#173326; --warn:#F2B23A; --bad:#F2766E; --veg:#4CC27F; --nonveg:#F2766E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171211; --panel:#221B19; --ink:#F3ECEA; --muted:#A8958F; --line:#3A2F2C;
  --chilli:#E8354F; --chilli-ink:#FFFFFF; --chilli-soft:#3D1A1F; --amber:#F2B23A; --amber-soft:#3A2C10;
  --ok:#4CC27F; --ok-soft:#173326; --warn:#F2B23A; --bad:#F2766E; --veg:#4CC27F; --nonveg:#F2766E; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:10px;background:var(--chilli);color:var(--chilli-ink);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-size:11px;font-weight:600;letter-spacing:.18em;opacity:.85}
.top .sp{flex:1}
.top .clock{font-family:var(--display);font-size:18px;font-weight:600}
.main{flex:1;min-height:0;display:flex}
.view{flex:1;min-width:0;overflow-y:auto;padding-block:12px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--chilli)}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:4px 0 10px;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:18px;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.03em}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;padding:8px 10px;border-radius:7px;font-weight:600;white-space:nowrap;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);white-space:nowrap;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--chilli);border-color:var(--chilli);color:var(--chilli-ink)}
.inp{width:100%;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel)}
.inp:focus{outline:2px solid var(--chilli);outline-offset:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.item{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 9px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;transition:transform .08s}
.item:active{transform:scale(.97)}
.item .nm{font-weight:600;line-height:1.2;font-size:14.5px;padding-right:14px}
.item .pr{font-family:var(--display);font-weight:700;font-size:19px}
.item .q{position:absolute;top:-6px;right:-6px;background:var(--chilli);color:var(--chilli-ink);min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px;padding:0 6px}
.item[disabled]{opacity:.45}
.dot{display:inline-block;width:11px;height:11px;border:1.5px solid currentColor;border-radius:2px;position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:2px;border-radius:50%;background:currentColor}
.dot.v{color:var(--veg)}.dot.n{color:var(--nonveg)}
.item .dot{position:absolute;top:10px;right:9px}
.item.ph{padding-top:0;overflow:hidden}
.item .iph{display:block;width:calc(100% + 20px);margin:0 -10px 2px;height:78px;object-fit:cover;background:var(--amber-soft)}
.item.ph .dot{background:var(--panel);border-radius:3px;box-shadow:0 0 0 2px var(--panel)}
.btn{padding:11px 16px;border-radius:var(--r);font-weight:700;background:var(--panel);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--chilli);border-color:var(--chilli);color:var(--chilli-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:10px;padding:11px 12px}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--line);white-space:nowrap}
.pill.run{background:var(--amber-soft);color:var(--warn)}
.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.void{background:var(--chilli-soft);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:36px 16px}
.empty b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);text-transform:uppercase;margin-bottom:4px}
/* cart */
.cartbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));padding:0 max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));z-index:5;pointer-events:none}
.cartbar button{pointer-events:auto;width:100%;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.22);font-weight:600}
.cartbar .tot{font-family:var(--display);font-size:22px;font-weight:700;margin-left:auto}
.cart{display:flex;flex-direction:column;height:100%;min-height:0}
.cart .lines{flex:1;overflow-y:auto;min-height:60px}
.ln{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.ln .n{font-weight:600;line-height:1.2;min-width:0}
.ln .n small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stp button{width:32px;height:32px;font-size:18px;font-weight:700;color:var(--chilli)}
.stp span{min-width:26px;text-align:center;font-weight:700}
.ln .amt{font-weight:700;min-width:62px;text-align:right}
.sums{padding:8px 0;font-size:14px}
.sums div{display:flex;justify-content:space-between;padding:2px 0}
.sums .g{font-family:var(--display);font-size:26px;font-weight:700;padding-top:6px;border-top:2px solid var(--ink);margin-top:6px}
.side{display:none}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:380px;flex:none;background:var(--panel);border-left:1px solid var(--line);padding:12px 16px}
  .cartbar{display:none}
  .tabs{grid-template-columns:repeat(5,110px);justify-content:center}
}
/* tables */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tbl{aspect-ratio:1/1;max-width:100%;border-radius:14px;border:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tbl b{font-family:var(--display);font-size:30px;line-height:1}
.tbl small{font-size:12px;color:var(--muted);font-weight:600}
.tbl.busy{border-color:var(--amber);background:var(--amber-soft)}
.tbl.busy small{color:var(--warn)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--chilli);border-radius:4px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line)}
table.t td.r,table.t th.r{text-align:right}
.scroll{overflow-x:auto}
.uchip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);color:inherit;border-radius:999px;padding:5px 11px;font-weight:600;font-size:13px;max-width:40vw;overflow:hidden;white-space:nowrap}
.dayban{display:flex;align-items:center;gap:10px;background:var(--amber-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;font-size:14px}
.dayban.warn{background:var(--chilli-soft)}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cn{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;gap:2px 8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.cn span{font-weight:700;font-size:13px}.cn b{grid-column:1/-1;font-size:12px;color:var(--muted);font-weight:600}
.cn .inp{padding:7px 8px}
/* dashboard charts */
.vc{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;align-items:end;height:170px;padding-top:4px}
.vcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vbar{width:100%;max-width:34px;background:var(--amber);border-radius:4px 4px 0 0;min-height:0}
.vbar.hi{background:var(--chilli)}
.vbar.neg{background:var(--bad);opacity:.6}
.vv{font-size:9.5px;color:var(--muted);white-space:nowrap;margin-bottom:2px;transform:rotate(-0deg)}
.vl{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.tip{background:var(--chilli-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:13.5px;line-height:1.45;margin-top:10px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(20,10,8,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .18s ease-out}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:16px;max-height:86%}}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.item{transition:none}}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet .hd h2{margin:0;flex:1}
.sheet .bd{overflow-y:auto;min-height:0;flex:1}
.sheet .ft{display:flex;gap:8px;padding-top:10px;flex-wrap:wrap}
.sheet .ft .btn{flex:1}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.receipt{font-family:ui-monospace,"Roboto Mono",Menlo,monospace;font-size:12.5px;line-height:1.35;background:#fff;color:#111;padding:14px;border-radius:6px;white-space:pre;overflow-x:auto;margin:0 auto;max-width:100%}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:90%;text-align:center}
.paymodes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pm{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px}
.pm .row{flex-wrap:nowrap}
.big{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.note{font-size:13px;color:var(--muted)}
.warnbox{background:var(--amber-soft);color:var(--warn);padding:9px 12px;border-radius:var(--r);font-size:13.5px;font-weight:600}
.menu-more{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.menu-more button{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.menu-more b{font-family:var(--display);font-size:19px;text-transform:uppercase}
.menu-more span{font-size:12.5px;color:var(--muted)}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:.15s;pointer-events:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--panel);transition:.15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{left:21px}
</style>

<div id="app">
  <header class="top">
    <div class="brand">Red Chilli<small>Fried Chicken</small></div>
    <div class="sp"></div>
    <button class="uchip" id="webchip" hidden style="background:var(--amber);color:#1A1312"></button>
    <button class="uchip" id="userchip" hidden></button>
    <div class="clock num" id="clock"></div>
  </header>
  <div class="main">
    <section class="view" id="view"></section>
    <aside class="side" id="side"></aside>
  </div>
  <div class="cartbar" id="cartbar" hidden></div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=n=>Math.round((+n+Number.EPSILON)*100)/100;
const inr=n=>"₹"+(+n||0).toLocaleString("en-IN",{minimumFractionDigits:0,maximumFractionDigits:2});
const inr2=n=>"₹"+(+n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const dkey=d=>{d=new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const tfmt=d=>new Date(d).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});
const dtfmt=d=>new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short"})+" "+tfmt(d);
const AB=window.AndroidBridge||null;

/* ---------- storage ---------- */
const mem={};

  set(k,v){mem[k]=v;try{localStorage.setItem("rcfc_"+k,JSON.stringify(v))}catch(e){if(window.toast)setTimeout(()=>toast("Phone storage for the app is full. Take a backup and remove demo data."),300)}
    if(SYNC_KEYS.includes(k)&&window.scheduleSync&&window.D&&D.settings&&D.settings.cloud&&D.settings.cloud.role==="counter")scheduleSync();
    if((k==="items"||k==="cats"||k==="addons")&&window.scheduleHqMenu&&window.D&&D.settings&&D.settings.cloud&&D.settings.cloud.role==="viewer")scheduleHqMenu()}
};

/* ---------- order maths ---------- */
function priceFor(item,type){const b=+item.price;return isOnline(type)&&D.settings.onlineMarkup?Math.round(b*(1+D.settings.onlineMarkup/100)):b}
function calc(o){
  const st=D.settings;let sub=0;o.lines.forEach(l=>sub+=l.price*l.qty);sub=r2(sub);
  let disc=0;if(o.disc&&o.disc.val){disc=o.disc.type==="pct"?sub*o.disc.val/100:+o.disc.val}disc=r2(Math.min(disc,sub));
  const chg=r2((+o.charges||0));
  const taxable=r2(sub-disc+chg);let tax=0,total;
  const rate=(+st.gstRate||0)/100;
  if(st.gstOn&&rate&&!isOnline(o.type)){ if(st.inclusive){tax=r2(taxable-taxable/(1+rate));total=taxable}else{tax=r2(taxable*rate);total=taxable+tax} }
  else total=taxable;
  const grand=Math.round(total);const ro=r2(grand-total);
  return {sub,disc,chg,taxable,tax,cgst:r2(tax/2),sgst:r2(tax-r2(tax/2)),ro,grand,qty:o.lines.reduce((a,l)=>a+l.qty,0)};
}
function nextToken(){const k=dkey(Date.now());D.tokens={[k]:(D.tokens[k]||0)+1};save("tokens");return D.tokens[k]}
function newOrder(type,table){
  return {id:uid(),type:type||"take",table:table||null,lines:[],disc:null,charges:0,cust:{name:"",phone:"",addr:""},note:"",status:"open",
    created:Date.now(),token:null,billNo:null,pay:[],kots:0,platformId:""};
}
function curOrder(){if(!S.cur||S.cur.status!=="open")S.cur=newOrder(S.lastType&&S.lastType!=="dine"?S.lastType:"take");return S.cur}
function persistCur(){
  const o=S.cur;if(!o)return;
  const i=D.orders.findIndex(x=>x.id===o.id);
  if(o.lines.length===0&&!o.kots){if(i>=0)D.orders.splice(i,1)}
  else{if(!o.token)o.token=nextToken();if(i>=0)D.orders[i]=o;else D.orders.push(o)}
  save("orders");
}
function runningOrders(){return D.orders.filter(o=>o.status==="open")}
function tableOrder(n){return D.orders.find(o=>o.status==="open"&&o.type==="dine"&&o.table===n)}

/* ---------- print layer ---------- */
const W=()=>+D.settings.paper||32;
const pad=(s,n)=>{s=String(s);return s.length>=n?s.slice(0,n):s+" ".repeat(n-s.length)};
const lpad=(s,n)=>{s=String(s);return s.length>=n?s:" ".repeat(n-s.length)+s};
const center=s=>{s=String(s);const w=W();if(s.length>=w)return s.slice(0,w);return " ".repeat(Math.floor((w-s.length)/2))+s};
const lr=(a,b)=>{const w=W();b=String(b);return pad(a,w-b.length-1)+" "+b};
const rs=n=>(+n).toFixed(2);
const dash=()=>"-".repeat(W());
function wrapName(name,w){const out=[];let s=name;while(s.length>w){let cut=s.lastIndexOf(" ",w);if(cut<4)cut=w;out.push(s.slice(0,cut));s=s.slice(cut).trim()}out.push(s);return out}
function billLines(o){
  const st=D.settings,c=calc(o),w=W(),L=[];
  L.push("<H>"+st.shop.toUpperCase());
  if(st.addr)wrapName(st.addr,w).forEach(x=>L.push("<C>"+x));
  if(st.phone)L.push("<C>Ph: "+st.phone);
  if(st.gstOn&&st.gstin)L.push("<C>GSTIN: "+st.gstin);
  if(st.fssai)L.push("<C>FSSAI: "+st.fssai);
  L.push(dash());
  L.push("<C><B>"+(o.status==="paid"?"TAX INVOICE":"ESTIMATE"));
  L.push(lr("Bill: "+(o.billNo||"-"),"Token: "+(o.token||"-")));
  L.push(lr(new Date(o.paidAt||o.created).toLocaleDateString("en-IN"),tfmt(o.paidAt||o.created)));
  L.push(lr("Type: "+TYPES[o.type]+(o.table?" T"+o.table:""),o.platformId?"#"+o.platformId:""));
  if(o.cust&&(o.cust.name||o.cust.phone))L.push("Cust: "+[o.cust.name,o.cust.phone].filter(Boolean).join(" "));
  if((o.type==="del"||o.webMode==="delivery")&&o.cust.addr)wrapName("Addr: "+o.cust.addr,w).forEach(x=>L.push(x));
  L.push(dash());
  const nw=w-17;L.push(pad("Item",nw)+lpad("Qty",4)+lpad("Rate",6)+lpad("Amt",7));
  L.push(dash());
  o.lines.forEach(l=>{const nums=lpad(l.qty,4)+lpad(Math.round(l.price),6)+lpad(Math.round(l.price*l.qty),7);
    if(l.name.length<=nw)L.push(pad(l.name,nw)+nums);else{wrapName(l.name,w).forEach(x=>L.push(x));L.push(pad("",nw)+nums)}
    if(l.note)L.push("  * "+l.note)});
  L.push(dash());
  L.push(lr("Items: "+c.qty+"   Subtotal",rs(c.sub)));
  if(c.disc)L.push(lr("Discount"+(o.disc.type==="pct"?" ("+o.disc.val+"%)":""),"-"+rs(c.disc)));
  if(c.chg)L.push(lr("Packing/Delivery",rs(c.chg)));
  if(c.tax){L.push(lr("CGST "+(st.gstRate/2)+"%"+(st.inclusive?" (incl)":""),rs(c.cgst)));L.push(lr("SGST "+(st.gstRate/2)+"%"+(st.inclusive?" (incl)":""),rs(c.sgst)))}
  if(c.ro)L.push(lr("Round off",rs(c.ro)));
  L.push(dash());
  L.push("<B>"+lr("TOTAL  Rs.",rs(c.grand)));
  if(o.pay&&o.pay.length){L.push(dash());o.pay.forEach(p=>L.push(lr("Paid "+p.mode,rs(p.amt))));if(o.change)L.push(lr("Change returned",rs(o.change)))}
  L.push(dash());
  if(st.printQR&&st.upiId&&o.status!=="paid"){L.push("<C>Scan to pay via UPI");L.push("<Q>upi://pay?pa="+encodeURIComponent(st.upiId)+"&pn="+encodeURIComponent(st.shop)+"&am="+c.grand.toFixed(2)+"&cu=INR")}
  if(st.footer)wrapName(st.footer,w).forEach(x=>L.push("<C>"+x));
  return L;
}
function kotLines(o,lines,isAll){
  const L=[];L.push("<H>KOT #"+(o.kots));
  L.push("<C><B>"+TYPES[o.type].toUpperCase()+(o.webMode?" "+o.webMode.toUpperCase():"")+(o.table?"  TABLE "+o.table:"")+"  TOKEN "+o.token);
  L.push(lr(new Date().toLocaleDateString("en-IN"),tfmt(Date.now())));
  if(isAll)L.push("<C>(REPRINT - ALL ITEMS)");
  L.push(dash());
  lines.forEach(l=>{L.push("<B>"+lpad(l.qty,3)+" x "+l.name);if(l.note)L.push("      >> "+l.note)});
  if(o.note){L.push(dash());L.push("Note: "+o.note)}
  L.push(dash());return L;
}
function toPlain(L){return L.map(x=>{if(x.startsWith("<Q>"))return center("[ UPI QR ]");const t=x.replace(/^(<[HCB]>)+/,"");return /^(<B>)?<[HC]>/.test(x)||x.startsWith("<C>")||x.startsWith("<H>")?center(t):t}).join("\n")}
function doPrint(L,title,copies){
  copies=copies||1;
  if(AB&&D.settings.printer){
    try{const res=AB.printEscPos(D.settings.printer,L.join("\n"),copies);if(res!=="OK")toast("Printer: "+res);else toast(title+" sent to printer")}catch(e){toast("Print failed: "+e.message)}
    return;
  }
  showReceipt(title,toPlain(L));
}
function showReceipt(title,txt){
  sheet(`<div class="hd"><h2>${esc(title)}</h2><button class="btn sm" data-x>Close</button></div>
  <div class="bd"><pre class="receipt">${esc(txt)}</pre>
  <p class="note">${AB?"No Bluetooth printer selected. Set one in More › Printer, or use system print.":"Preview only. In the Android app this goes straight to your Bluetooth thermal printer."}</p></div>
  <div class="ft">${AB?'<button class="btn dark" id="sysprint">System print</button>':""}<button class="btn" id="cpy">Copy text</button></div>`);
  $("#cpy").onclick=()=>copyText(txt);
  if(AB)$("#sysprint").onclick=()=>{try{AB.printSystem(title,"<pre style='font:12px monospace'>"+esc(txt)+"</pre>")}catch(e){toast(e.message)}};
}
function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast("Copied"),()=>toast("Copy blocked: select the text instead"))}catch(e){toast("Copy blocked: select the text instead")}}

function bindCart(root,inSheet){
  root.onclick=e=>{
    const o=curOrder();const b=e.target.closest("button");if(!b)return;
    if(b.dataset.p){const l=o.lines.find(x=>x.lid===b.dataset.p);l.qty++;persistCur();refreshCart(inSheet);return}
    if(b.dataset.m){const l=o.lines.find(x=>x.lid===b.dataset.m);
      if(l.qty-1<l.kot){return withPin(()=>{l.qty--;l.kot=Math.min(l.kot,l.qty);if(!l.qty)o.lines=o.lines.filter(x=>x!==l);persistCur();logA("Removed item after KOT",l.name+" · token "+o.token);toast("Removed an item already sent to kitchen");refreshCart(inSheet)},"Removing an item already sent to kitchen")}
      l.qty--;if(!l.qty)o.lines=o.lines.filter(x=>x!==l);persistCur();refreshCart(inSheet);return}
    const a=b.dataset.act;if(!a)return;
    if(a==="disc")return discSheet();
    if(a==="cust")return custSheet();
    if(a==="note")return noteSheet();
    if(a==="cancel")return cancelOrder();
    if(a==="move")return moveTable();
    if(a==="webready"){webMark(o,"ready").then(()=>{toast("Customer told: "+(o.webMode==="delivery"?"out for delivery":"ready for pickup"));refreshCart(inSheet)});return}
    if(a==="merge")return mergeTable();
    if(a==="split")return splitBill();
    if(a==="kot")return sendKOT(o);
    if(a==="print"){doPrint(billLines(o),"Bill");return}
    if(a==="pay")return paySheet(o);
  };
}
function sendKOT(o,all){

  if(!lines.length){toast("Nothing new for the kitchen");return}
  o.kots=(o.kots||0)+(all?0:1);if(!o.kots)o.kots=1;
  o.lines.forEach(l=>l.kot=l.qty);
  if(o===S.cur)persistCur();else save("orders");
  doPrint(kotLines(o,lines,all),"KOT",+D.settings.kotCopies||1);
  if(o===S.cur)refreshCart(!!$("#cartsheet"));
}

/* ---------- payment ---------- */
function paySheet(o,onCancel,onDone){
  const c=calc(o);let done=false;
  const modes=isOnline(o.type)?[TYPES[o.type]+" (prepaid)","Cash"]:["Cash","UPI","Card","Credit"];
  const pv={};modes.forEach(m=>pv[m]=0);pv[modes[0]]=c.grand;
  sheet(`<div class="hd"><h2>Payment</h2><button class="btn sm" data-x>Back</button></div>
  <div class="bd">
   <div class="row" style="align-items:flex-end;margin-bottom:10px"><div class="grow"><div class="lbl">Amount due</div><div class="big num">${inr(c.grand)}</div></div>
   <div class="note" style="text-align:right">${c.qty} items${o.token?"<br>Token "+o.token:""}</div></div>
   <div class="lbl" style="margin-bottom:6px">Tap a mode to pay in full, or type amounts to split</div>
   <div class="paymodes">${modes.map((m,i)=>`<div class="pm"><button class="btn sm ${i?"":"dark"}" style="width:100%;margin-bottom:6px" data-full="${esc(m)}">${esc(m)}</button><input class="inp num" type="number" inputmode="decimal" data-m="${esc(m)}" id="pm${i}" aria-label="${esc(m)} amount" value="${pv[m]||""}"></div>`).join("")}</div>
   <div class="card" style="margin-top:10px" id="paystat"></div>
   ${modes.includes("Credit")?`<p class="note">Credit needs a customer mobile number.</p>`:""}
  </div>
  <div class="ft"><button class="btn ok" id="paydone" style="flex:2">Complete &amp; print</button><button class="btn" id="paynop">Complete</button></div>`,()=>{if(!done&&onCancel)onCancel()});
  const inputs=[...document.querySelectorAll("[data-m]")];
  const stat=()=>{let tot=0;inputs.forEach(i=>tot+=+i.value||0);const cash=+(inputs.find(i=>i.dataset.m==="Cash")||{}).value||0;
    const diff=r2(tot-c.grand);let h;
    if(diff<0)h=`<div class="row"><span class="grow">Remaining</span><b class="num" style="color:var(--bad)">${inr2(-diff)}</b></div>`;
    else if(diff>0&&cash>=diff)h=`<div class="row"><span class="grow">Return change</span><b class="num big" style="font-size:28px;color:var(--ok)">${inr2(diff)}</b></div>`;
    else if(diff>0)h=`<div class="row"><span class="grow">Over by</span><b class="num" style="color:var(--bad)">${inr2(diff)}</b></div>`;
    else h=`<div class="row"><span class="grow">Fully paid</span><b style="color:var(--ok)">✓</b></div>`;
    $("#paystat").innerHTML=h;return {tot,diff,cash}};
  inputs.forEach(i=>i.oninput=stat);
  document.querySelectorAll("[data-full]").forEach(b=>b.onclick=()=>{inputs.forEach(i=>i.value=i.dataset.m===b.dataset.full?c.grand:"");
    document.querySelectorAll("[data-full]").forEach(x=>x.classList.toggle("dark",x===b));stat()});
  stat();
  const finish=print=>{
    const s=stat();if(s.diff<0)return toast("Amount is short by "+inr2(-s.diff));
    if(s.diff>0&&s.cash<s.diff)return toast("Only cash can be more than the bill");
    const pays=inputs.filter(i=>+i.value>0).map(i=>({mode:i.dataset.m,amt:r2(+i.value)}));
    if(s.diff>0){const cp=pays.find(p=>p.mode==="Cash");cp.amt=r2(cp.amt-s.diff)}
    if(pays.some(p=>p.mode==="Credit")&&!o.cust.phone){toast("Add customer mobile for credit");return}
    done=true;closeSheet();completeOrder(o,pays,s.diff>0?s.diff:0,print);if(onDone)onDone();
  };
  $("#paydone").onclick=()=>finish(true);$("#paynop").onclick=()=>finish(false);
}
function completeOrder(o,pays,change,print){
  const st=D.settings;const c=calc(o);
  if(o.lines.some(l=>l.qty>l.kot)&&o.type!=="dine"){/* auto-KOT for quick service */ sendKOT(o)}
  o.status="paid";o.paidAt=Date.now();o.pay=pays;o.by=S.user?S.user.name:"";o.change=change;o.billNo=st.billPrefix+String(st.nextBill).padStart(4,"0");o.total=c.grand;
  st.nextBill++;save("settings");
  const i=D.orders.findIndex(x=>x.id===o.id);if(i>=0)D.orders[i]=o;else D.orders.push(o);save("orders");
  // stock: chicken grams
  const g=o.lines.reduce((a,l)=>a+(l.cg||0)*l.qty,0);
  const ch=D.stock.find(s=>s.id==="chicken");
  if(g&&ch){ch.qty=r2(ch.qty-g/1000);D.stockLog.push({t:Date.now(),sid:"chicken",q:-r2(g/1000),why:"Sale "+o.billNo});save("stock","stockLog")}
  if(o.cust.phone){const cu=D.customers[o.cust.phone]||{name:"",addr:"",visits:0,spent:0,due:0};cu.name=o.cust.name||cu.name;cu.addr=o.cust.addr||cu.addr;cu.visits++;cu.spent=r2(cu.spent+c.grand);cu.last=Date.now();
    const cr=pays.find(p=>p.mode==="Credit");if(cr)cu.due=r2((cu.due||0)+cr.amt);D.customers[o.cust.phone]=cu;save("customers")}
  if(o===S.cur)S.cur=null;
  if(o.webId)webMark(o,"done");
  if(print)doPrint(billLines(o),"Bill "+o.billNo);else toast("Bill "+o.billNo+" saved");
  if(ch&&ch.qty<=ch.min)setTimeout(()=>toast("Low stock: "+ch.name+" "+ch.qty+" "+ch.unit),2400);
  render();
}

/* ---------- REPORTS & DASHBOARD ---------- */
/* Every report is built from per-day summaries. Bills older than KEEP_DAYS are folded into
   D.daySum so phone storage never fills up; recent bills stay in full for reprint. */
const KEEP_DAYS=60;
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const SLOTS=[["Morning","before 12 pm",0,12],["Lunch","12 – 4 pm",12,16],["Evening","4 – 8 pm",16,20],["Night","after 8 pm",20,24]];
const sod=d=>{d=new Date(d);d.setHours(0,0,0,0);return d.getTime()};
function lineCost(l){if(+l.cost)return +l.cost;const it=D.items.find(i=>i.id===l.iid)||D.items.find(i=>i.name===(l.base||l.name));return it&&it.cost?+it.cost:0}
function hasCost(l){if(l.cost)return true;const it=D.items.find(i=>i.id===l.iid)||D.items.find(i=>i.name===(l.base||l.name));return !!(it&&it.cost)}
function emptyDay(d){return {d,bills:0,net:0,tax:0,disc:0,gross:0,chg:0,cost:0,costAmt:0,byMode:{},byType:{},items:{},hours:{},voids:0,voidAmt:0,cg:0,byStaff:{}}}
function addOrderToDay(day,o){
  const c=calc(o);
  if(o.status==="void"){day.voids++;day.voidAmt=r2(day.voidAmt+c.grand);return}
  day.bills++;day.net=r2(day.net+c.grand);day.tax=r2(day.tax+c.tax);day.disc=r2(day.disc+c.disc);day.gross=r2(day.gross+c.sub);day.chg=r2(day.chg+c.chg);
  (o.pay||[]).forEach(p=>day.byMode[p.mode]=r2((day.byMode[p.mode]||0)+p.amt));
  const t=TYPES[o.type];const bt=day.byType[t]||(day.byType[t]=[0,0]);bt[0]++;bt[1]=r2(bt[1]+c.grand);
  const h=new Date(o.paidAt).getHours();const hh=day.hours[h]||(day.hours[h]=[0,0]);hh[0]++;hh[1]=r2(hh[1]+c.grand);
  if(o.by){day.byStaff=day.byStaff||{};const bs=day.byStaff[o.by]||(day.byStaff[o.by]=[0,0]);bs[0]++;bs[1]=r2(bs[1]+c.grand)}
  o.lines.forEach(l=>{const key=l.base||l.name;const it=D.items.find(i=>i.id===l.iid)||D.items.find(i=>i.name===key);
    const x=day.items[key]||(day.items[key]=[0,0,0,it?it.cat:"Other",it&&it.veg?1:0]);
    x[0]+=l.qty;x[1]=r2(x[1]+l.qty*l.price);const lc=lineCost(l)*l.qty;x[2]=r2(x[2]+lc);
    day.cost=r2(day.cost+lc);if(hasCost(l))day.costAmt=r2(day.costAmt+l.qty*l.price);day.cg+=(l.cg||0)*l.qty});
}
function archiveOld(){
  const cut=sod(Date.now())-KEEP_DAYS*864e5;let n=0;
  const keep=[];D.orders.forEach(o=>{const t=o.paidAt||o.voidAt||o.created;
    if(o.status!=="open"&&!o.demo&&t<cut){const k=dkey(t);const day=D.daySum[k]||(D.daySum[k]=emptyDay(k));addOrderToDay(day,o);n++}else keep.push(o)});
  if(n){const gone=D.orders.filter(o=>!keep.includes(o)).map(o=>o.id);D.orders=keep;forgetArchived(gone);save("orders","daySum")}
}
function rangeBounds(r){
  const now=new Date();
  if(r==="today")return [sod(now),Date.now()+1];
  if(r==="yday")return [sod(now)-864e5,sod(now)];
  if(r==="7d")return [sod(now)-6*864e5,Date.now()+1];
  if(r==="30d")return [sod(now)-29*864e5,Date.now()+1];
  if(r==="month")return [new Date(now.getFullYear(),now.getMonth(),1).getTime(),Date.now()+1];
  if(r==="lmonth")return [new Date(now.getFullYear(),now.getMonth()-1,1).getTime(),new Date(now.getFullYear(),now.getMonth(),1).getTime()];
  if(r==="custom")return [S.from?sod(S.from):sod(now),S.to?sod(S.to)+864e5:Date.now()+1];
}
function daysIn(a,b){
  const map={};
  Object.values(D.daySum).forEach(d=>{const t=new Date(d.d+"T00:00:00").getTime();if(t>=a&&t<b)map[d.d]=JSON.parse(JSON.stringify(d))});
  D.orders.forEach(o=>{if(o.status==="open")return;const t=o.status==="paid"?o.paidAt:(o.voidAt||0);if(t<a||t>=b)return;
    const k=dkey(t);addOrderToDay(map[k]||(map[k]=emptyDay(k)),o)});
  return map;
}
function reportDataCore(a,b){
  const days=daysIn(a,b);
  const R={a,b,days,bills:0,gross:0,disc:0,tax:0,net:0,chg:0,cost:0,costAmt:0,byMode:{},byType:{},typeBills:{},items:{},hours:{},hourBills:{},voids:0,voidAmt:0,
    exp:0,expByCat:{},chickenKg:0,byStaff:{},dow:{},dowBills:{},slots:SLOTS.map(()=>[0,0]),cats:{},veg:[0,0],nonveg:[0,0],
    list:D.orders.filter(o=>o.status==="paid"&&o.paidAt>=a&&o.paidAt<b)};
  Object.values(days).forEach(d=>{
    R.bills+=d.bills;R.gross+=d.gross;R.disc+=d.disc;R.tax+=d.tax;R.net+=d.net;R.chg+=d.chg;R.cost+=d.cost;R.costAmt+=d.costAmt||0;R.voids+=d.voids;R.voidAmt+=d.voidAmt;R.chickenKg+=d.cg/1000;
    Object.entries(d.byMode).forEach(([m,v])=>R.byMode[m]=(R.byMode[m]||0)+v);
    Object.entries(d.byStaff||{}).forEach(([m,v])=>{const x=R.byStaff[m]||(R.byStaff[m]=[0,0]);x[0]+=v[0];x[1]+=v[1]});
    Object.entries(d.byType).forEach(([m,v])=>{R.byType[m]=(R.byType[m]||0)+v[1];R.typeBills[m]=(R.typeBills[m]||0)+v[0]});
    Object.entries(d.hours).forEach(([h,v])=>{R.hours[h]=(R.hours[h]||0)+v[1];R.hourBills[h]=(R.hourBills[h]||0)+v[0];
      const si=SLOTS.findIndex(s=>h>=s[2]&&h<s[3]);R.slots[si][0]+=v[0];R.slots[si][1]+=v[1]});
    const w=new Date(d.d+"T00:00:00").getDay();R.dow[w]=(R.dow[w]||0)+d.net;R.dowBills[w]=(R.dowBills[w]||0)+d.bills;
    Object.entries(d.items).forEach(([n,x])=>{const it=R.items[n]||(R.items[n]={q:0,amt:0,cost:0,cat:x[3],veg:x[4]});it.q+=x[0];it.amt+=x[1];it.cost+=x[2];
      const c=R.cats[x[3]]||(R.cats[x[3]]=[0,0]);c[0]+=x[0];c[1]+=x[1];const vv=x[4]?R.veg:R.nonveg;vv[0]+=x[0];vv[1]+=x[1]});
  });
  D.expenses.filter(e=>e.t>=a&&e.t<b).forEach(e=>{R.exp+=+e.amt;R.expByCat[e.cat]=(R.expByCat[e.cat]||0)+ +e.amt});
  // calendar days per weekday inside the range (up to today) for honest averages
  R.dowDays={};const end=Math.min(b,Date.now()+1);for(let t=sod(a);t<end;t+=864e5){const w=new Date(t).getDay();R.dowDays[w]=(R.dowDays[w]||0)+1}
  R.nDays=Object.values(R.dowDays).reduce((s,x)=>s+x,0)||1;
  ["gross","disc","tax","net","exp","cost","chickenKg","voidAmt"].forEach(k=>R[k]=r2(R[k]));
  R.salesEx=r2(R.net-R.tax);
  R.comm=r2((R.byType["Swiggy"]||0)*(+D.settings.swiggyComm||0)/100+(R.byType["Zomato"]||0)*(+D.settings.zomatoComm||0)/100);
  R.profit=r2(R.salesEx-R.exp-R.comm);
  return R;
}
const inr0=n=>inr(Math.round(+n||0));
const kfmt=n=>{n=+n||0;const a=Math.abs(n);return a>=1e7?"₹"+(n/1e7).toFixed(1)+"Cr":a>=1e5?"₹"+(n/1e5).toFixed(1)+"L":a>=1e3?"₹"+(n/1e3).toFixed(1)+"k":"₹"+Math.round(n)};
const pct=(x,t)=>t?Math.round(x/t*100):0;
/* vertical bar chart from plain divs: cols=[{l:label,v:value,hi:bool,neg:bool}] */
function vchart(cols,opt){opt=opt||{};const max=Math.max(1,...cols.map(c=>Math.abs(c.v)));
  const dense=cols.length>12,sparse=cols.length>16;
  return `<div class="vc" style="--n:${cols.length}">${cols.map((c,i)=>`<div class="vcol" title="${esc(c.l)}: ${esc(inr0(c.v))}"><span class="vv num">${c.v&&(!dense||c.hi&&!sparse)?kfmt(c.v):""}</span><div class="vbar ${c.hi?"hi":""} ${c.v<0?"neg":""}" style="height:${Math.max(c.v?3:0,Math.abs(c.v)/max*100)}%"></div><span class="vl">${!sparse||i%5===0||i===cols.length-1?esc(c.l):"&nbsp;"}</span></div>`).join("")}</div>`}
function hbars(rows,fmt){const max=Math.max(1,...rows.map(r=>r[1]));fmt=fmt||(v=>inr0(v));
  return `<div class="list">${rows.map(r=>`<div class="li" style="display:block"><div class="row" style="flex-wrap:nowrap"><span class="grow" style="min-width:0">${r[0]}</span><b class="num">${fmt(r[1])}</b></div>${r[2]!=null?`<div class="note num">${r[2]}</div>`:""}<div class="bar"><i style="width:${r[1]/max*100}%"></i></div></div>`).join("")}</div>`}
const tip=(t)=>`<div class="tip">${t}</div>`;

function repProfit(R){
  const exps=Object.entries(R.expByCat).sort((x,y)=>y[1]-x[1]);
  const covered=pct(R.costAmt,R.gross);
  const itemsWithCost=Object.entries(R.items).filter(([n,x])=>x.cost>0).map(([n,x])=>[n,x.amt-x.cost,x]).sort((p,q)=>q[1]-p[1]);
  return `<div class="stats">
    <div class="stat"><div class="lbl">Sales (no GST)</div><div class="v num">${inr0(R.salesEx)}</div></div>
    <div class="stat"><div class="lbl">Expenses${R.comm?" + commission":""}</div><div class="v num">${inr0(R.exp+R.comm)}</div></div>
    <div class="stat"><div class="lbl">Profit</div><div class="v num" style="color:${R.profit<0?"var(--bad)":"var(--ok)"}">${inr0(R.profit)}</div></div>

function repItems(R){

  const cats=Object.entries(R.cats).sort((x,y)=>y[1][1]-x[1][1]);
  const totQ=all.reduce((s,x)=>s+x[1].q,0);
  const sold=new Set(all.map(x=>x[0]));
  const notSold=D.items.filter(i=>i.avail&&!sold.has(i.name));
  const slow=byQ.slice().reverse().filter(x=>x[1].q<=Math.max(2,totQ*0.005)).slice(0,10);
  // ABC: items making top 70% of sales are A (fast), next 20% B, rest C (slow)
  let run=0;const abc={A:0,B:0,C:0};byA.forEach(([n,x])=>{run+=x.amt;const s=run/R.gross;x.cls=s<=0.7||abc.A===0?"A":s<=0.9?"B":"C";abc[x.cls]++});

    <div class="stat"><div class="lbl">Non-veg</div><div class="v num">${pct(R.nonveg[1],vegT)}%</div><div class="note num">Veg ${pct(R.veg[1],vegT)}% of sales</div></div>

  ${hbars(byA.slice(0,10).map(([n,x])=>[esc(n)+` <span class="pill paid">${x.cls}</span>`,x.amt,x.q+" sold"]))}
  ${tip("<b>A</b> = fast movers that make 70% of your sales. Never let them run out. <b>B</b> = next 20%. <b>C</b> = slow; think about removing or promoting them.")}
  <h3>Category share</h3>
  ${hbars(cats.map(([c,x])=>[esc(c),x[1],x[0]+" sold · "+pct(x[1],R.gross)+"%"]))}

  ${notSold.length?`<h3>Not sold at all <span class="lbl">${notSold.length}</span></h3><div class="card note" style="line-height:1.6">${notSold.slice(0,60).map(i=>esc(i.name)).join(" · ")}${notSold.length>60?" …":""}</div>`:""}`;

function repTiming(R){
  if(!R.bills)return noSales();
  const hrs=[];for(let h=8;h<24;h++)hrs.push(h);
  Object.keys(R.hours).map(Number).forEach(h=>{if(!hrs.includes(h))hrs.push(h)});hrs.sort((x,y)=>x-y);
  const peakH=Object.entries(R.hours).sort((x,y)=>y[1]-x[1])[0];
  const hl=h=>(h%12||12)+(h<12?"a":"p");
  const dowAvg=[1,2,3,4,5,6,0].map(w=>({w,avg:R.dowDays[w]?(R.dow[w]||0)/R.dowDays[w]:0,bills:R.dowDays[w]?(R.dowBills[w]||0)/R.dowDays[w]:0}));
  const best=dowAvg.slice().sort((x,y)=>y.avg-x.avg)[0];
  const wk=[1,2,3,4,5],we=[6,0];
  const grp=ws=>{const days=ws.reduce((s,w)=>s+(R.dowDays[w]||0),0),sales=ws.reduce((s,w)=>s+(R.dow[w]||0),0),bills=ws.reduce((s,w)=>s+(R.dowBills[w]||0),0);return {days,sales,bills,avg:days?sales/days:0,bpd:days?bills/days:0,ab:bills?sales/bills:0}};
  const A=grp(wk),B=grp(we);const lift=A.avg?Math.round((B.avg-A.avg)/A.avg*100):0;
  return `<div class="stats">
    <div class="stat"><div class="lbl">Peak hour</div><div class="v num">${peakH?(+peakH[0]%12||12)+(peakH[0]<12?" am":" pm"):"-"}</div><div class="note num">${peakH?inr0(peakH[1])+" in period":""}</div></div>
    <div class="stat"><div class="lbl">Best day</div><div class="v">${DOW[best.w]}</div><div class="note num">avg ${inr0(Math.round(best.avg))} a day</div></div>
    <div class="stat"><div class="lbl">Weekend vs weekday</div><div class="v num" style="color:${lift<0?"var(--bad)":"var(--ok)"}">${lift>0?"+":""}${lift}%</div><div class="note">sales per day</div></div>
    <div class="stat"><div class="lbl">Busiest slot</div><div class="v">${SLOTS[R.slots.map(s=>s[1]).indexOf(Math.max(...R.slots.map(s=>s[1])))][0]}</div><div class="note num">${pct(Math.max(...R.slots.map(s=>s[1])),R.net)}% of sales</div></div>
  </div>
  <h3>Sales by hour</h3>
  <div class="card">${vchart(hrs.map(h=>({l:hl(h),v:Math.round(R.hours[h]||0),hi:peakH&&+peakH[0]===h})))}</div>
  <h3>Time slots</h3>
  <div class="card scroll"><table class="t num"><thead><tr><th>Slot</th><th class="r">Bills</th><th class="r">Sales</th><th class="r">Share</th><th class="r">Avg bill</th></tr></thead>
  <tbody>${SLOTS.map((s,i)=>`<tr><td><b>${s[0]}</b><div class="note">${s[1]}</div></td><td class="r">${R.slots[i][0]}</td><td class="r">${inr0(R.slots[i][1])}</td><td class="r">${pct(R.slots[i][1],R.net)}%</td><td class="r">${inr0(R.slots[i][0]?Math.round(R.slots[i][1]/R.slots[i][0]):0)}</td></tr>`).join("")}</tbody></table></div>
  <h3>Average sales by day of week</h3>
  <div class="card">${vchart(dowAvg.map(d=>({l:DOW[d.w],v:Math.round(d.avg),hi:d.w===0||d.w===6})))}<p class="note" style="margin:6px 0 0">Average per day, so a range with more Mondays doesn't look better. Red bars are the weekend.</p></div>
  <h3>Weekday vs weekend</h3>
  <div class="card scroll"><table class="t num"><thead><tr><th></th><th class="r">Weekday<div class="note">Mon–Fri</div></th><th class="r">Weekend<div class="note">Sat–Sun</div></th></tr></thead><tbody>
   <tr><td>Days in period</td><td class="r">${A.days}</td><td class="r">${B.days}</td></tr>
   <tr><td>Total sales</td><td class="r">${inr0(A.sales)}</td><td class="r">${inr0(B.sales)}</td></tr>
   <tr><td>Sales per day</td><td class="r"><b>${inr0(Math.round(A.avg))}</b></td><td class="r"><b>${inr0(Math.round(B.avg))}</b></td></tr>
   <tr><td>Bills per day</td><td class="r">${A.bpd.toFixed(1)}</td><td class="r">${B.bpd.toFixed(1)}</td></tr>
   <tr><td>Average bill</td><td class="r">${inr0(Math.round(A.ab))}</td><td class="r">${inr0(Math.round(B.ab))}</td></tr></tbody></table></div>`;
}

function monthRows(n){
  const now=new Date();const rows=[];
  for(let i=n-1;i>=0;i--){const s=new Date(now.getFullYear(),now.getMonth()-i,1),e=new Date(now.getFullYear(),now.getMonth()-i+1,1);
    const R=reportData(s.getTime(),Math.min(e.getTime(),Date.now()+1));
    rows.push({label:s.toLocaleDateString("en-IN",{month:"short"}),full:s.toLocaleDateString("en-IN",{month:"long",year:"numeric"}),R})}
  return rows;
}
function repTrend(){
  const rows=monthRows(12);const any=rows.some(r=>r.R.bills);
  if(!any)return noSales();
  const cur=rows[rows.length-1],prev=rows[rows.length-2];
  const now=new Date();const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();const dsf=now.getDate();
  const proj=Math.round(cur.R.net/dsf*dim);
  const g=prev.R.net?Math.round((cur.R.net-prev.R.net)/prev.R.net*100):0;
  const [a,b]=[sod(Date.now())-29*864e5,Date.now()+1];const R30=reportData(a,b);
  const daily=[];for(let t=a;t<b;t+=864e5){const k=dkey(t);const d=R30.days[k];daily.push({l:String(new Date(t).getDate()),v:d?Math.round(d.net):0,hi:[0,6].includes(new Date(t).getDay())})}
  return `<div class="stats">
    <div class="stat"><div class="lbl">This month so far</div><div class="v num">${inr0(cur.R.net)}</div><div class="note num">${dsf} of ${dim} days</div></div>
    <div class="stat"><div class="lbl">Month-end estimate</div><div class="v num">${inr0(proj)}</div><div class="note">at the current daily pace</div></div>
    <div class="stat"><div class="lbl">Last month</div><div class="v num">${inr0(prev.R.net)}</div><div class="note num">${g>0?"+":""}${g}% this month so far</div></div>
    <div class="stat"><div class="lbl">Profit this month</div><div class="v num" style="color:${cur.R.profit<0?"var(--bad)":"var(--ok)"}">${inr0(cur.R.profit)}</div><div class="note num">margin ${cur.R.salesEx?pct(cur.R.profit,cur.R.salesEx):0}%</div></div>
  </div>
  <h3>Monthly sales · last 12 months</h3>
  <div class="card">${vchart(rows.map((r,i)=>({l:r.label,v:Math.round(r.R.net),hi:i===rows.length-1})))}</div>
  <h3>Monthly profit</h3>

  <h3>Month by month</h3>

  <tbody>${rows.slice().reverse().filter(r=>r.R.bills||r.R.exp).map(r=>`<tr><td>${esc(r.full)}</td><td class="r">${r.R.bills}</td><td class="r">${inr0(r.R.net)}</td><td class="r">${inr0(r.R.exp)}</td><td class="r" style="color:${r.R.profit<0?"var(--bad)":"inherit"}"><b>${inr0(r.R.profit)}</b></td></tr>`).join("")}</tbody></table></div>
  <div class="row" style="margin-top:12px"><button class="btn grow" id="csvm">Export monthly summary (CSV)</button></div>`;

function zLines(R,label){
  const L=["<H>SALES REPORT","<C>"+D.settings.shop,"<C>"+label+" · printed "+dtfmt(Date.now()),dash()];
  L.push(lr("Bills",R.bills));L.push(lr("Item total",rs(R.gross)));L.push(lr("Discounts","-"+rs(R.disc)));L.push(lr("GST collected",rs(R.tax)));L.push("<B>"+lr("NET SALES",rs(R.net)));
  L.push(dash());L.push("<B>Collection");Object.entries(R.byMode).forEach(([m,a])=>L.push(lr(m,rs(a))));
  L.push(dash());L.push("<B>Order types");Object.entries(R.byType).forEach(([m,a])=>L.push(lr(m+" ("+R.typeBills[m]+")",rs(a))));

  const cashIn=R.byMode["Cash"]||0;const cashExp=D.expenses.filter(e=>e.t>=R.a&&e.t<R.b&&e.mode!=="UPI").reduce((s,e)=>s+ +e.amt,0);

function loadDemo(days){
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const weights=D.items.map(i=>{const n=i.name.toLowerCase();return /fried chicken|wings|popcorn|zinger|strips|combo 1|combo 2|french fries|mojito|chicken rice|shawarma/.test(n)?6:/combo|pizza|burger|noodles|65|milkshake/.test(n)?3:1});
  const wsum=weights.reduce((a,b)=>a+b,0);
  const rItem=()=>{let r=Math.random()*wsum;for(let i=0;i<weights.length;i++){r-=weights[i];if(r<=0)return D.items[i]}return D.items[0]};
  const hourW=[[11,1],[12,3],[13,5],[14,4],[15,2],[16,2],[17,3],[18,5],[19,8],[20,9],[21,7],[22,3]];const hs=hourW.reduce((a,b)=>a+b[1],0);
  const rHour=()=>{let r=Math.random()*hs;for(const[h,w]of hourW){r-=w;if(r<=0)return h}return 20};
  let bill=900;
  for(let d=days;d>=1;d--){
    const base=sod(Date.now())-d*864e5;const dow=new Date(base).getDay();
    const n=Math.round((dow===0||dow===6?55:dow===5?42:32)*(0.85+Math.random()*0.3));
    for(let k=0;k<n;k++){
      const r=Math.random();const type=r<0.35?"take":r<0.6?"dine":r<0.72?"del":r<0.88?"swiggy":"zomato";
      const o=newOrder(type,type==="dine"?1+Math.floor(Math.random()*D.settings.tables):null);o.demo=true;
      const nl=1+Math.floor(Math.random()*3);
      for(let j=0;j<nl;j++){const it=rItem();o.lines.push({lid:uid(),iid:it.id,name:it.name,price:priceFor(it,type),qty:Math.random()<0.25?2:1,note:"",kot:1,cg:+it.chickenG||0,cost:it.cost||Math.round(it.price*(it.veg?0.3:0.4))})}
      const t=base+rHour()*36e5+Math.floor(Math.random()*36e5);
      o.created=t-6e5;o.paidAt=t;o.token=k+1;o.kots=1;o.status="paid";o.billNo="DEMO"+(bill++);
      const c=calc(o);o.total=c.grand;
      o.pay=isOnline(type)?[{mode:TYPES[type]+" (prepaid)",amt:c.grand}]:[{mode:Math.random()<0.55?"UPI":Math.random()<0.9?"Cash":"Card",amt:c.grand}];
      D.orders.push(o);
    }
    const ex=[["Chicken purchase",7500+Math.random()*2500],["Gas cylinder",dow===1?1900:0],["Vegetables",600+Math.random()*400],["Oil",dow%3===0?1800:0],["Salary / wages",3200],["Packing material",dow===2?900:0]];
    ex.forEach(([cat,amt])=>{if(amt>0)D.expenses.push({id:uid(),t:base+10*36e5,cat,amt:Math.round(amt),note:"Demo",mode:"Cash",demo:true})});
    if(new Date(base).getDate()===1)D.expenses.push({id:uid(),t:base+11*36e5,cat:"Rent",amt:30000,note:"Demo",mode:"UPI",demo:true});
  }
  save("orders","expenses");
}
function removeDemo(){D.orders=D.orders.filter(o=>!o.demo);D.expenses=D.expenses.filter(e=>!e.demo);save("orders","expenses")}

  <h3>Recent movements</h3>

function stockMoveSheet(s){
  sheet(`<div class="hd"><h2>${esc(s.name)}</h2><button class="btn sm" data-x>Close</button></div>
  <div class="bd"><p>Current: <b class="num">${s.qty} ${esc(s.unit)}</b></p>
  <div class="seg" id="mt"><button data-v="in" aria-pressed="true">Purchase / add</button><button data-v="out" aria-pressed="false">Used / wasted</button><button data-v="set" aria-pressed="false">Set count</button></div>
  <div class="two" style="margin-top:10px"><div class="fld"><label for="mq">Quantity (${esc(s.unit)})</label><input class="inp num" id="mq" type="number" inputmode="decimal"></div>
  <div class="fld"><label for="mc">Cost ₹ (adds to expenses)</label><input class="inp num" id="mc" type="number" inputmode="decimal"></div></div>
  <div class="fld"><label for="mn">Note</label><input class="inp" id="mn" placeholder="Supplier, reason"></div></div>
  <div class="ft"><button class="btn" id="medit">Edit item</button><button class="btn dark" id="mok">Save</button></div>`);
  let mode="in";$("#mt").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;mode=b.dataset.v;$("#mt").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  $("#medit").onclick=()=>stockItemSheet(s);
  $("#mok").onclick=()=>{const q=+$("#mq").value;if(!(q>=0)||$("#mq").value==="")return toast("Enter a quantity");
    const before=s.qty;s.qty=r2(mode==="in"?s.qty+q:mode==="out"?s.qty-q:q);
    D.stockLog.push({t:Date.now(),sid:s.id,q:r2(s.qty-before),why:(mode==="in"?"Purchase":mode==="out"?"Used/wasted":"Count")+($("#mn").value?" · "+$("#mn").value:"")});
    const cost=+$("#mc").value;if(cost>0)D.expenses.push({id:uid(),t:Date.now(),cat:"Purchase",amt:cost,note:s.name+" "+q+" "+s.unit,mode:"Cash"});
    save("stock","stockLog","expenses");closeSheet();render();toast("Stock updated")};
}

function groupsFor(it){return D.addons.filter(g=>g.cats.includes(it.cat)&&g.choices.length)}
const addonPrice=(p,type)=>isOnline(type)&&D.settings.onlineMarkup?Math.round(p*(1+D.settings.onlineMarkup/100)):+p;
function pickOptions(it){
  const o=curOrder();const gs=groupsFor(it);
  const sel=gs.map(g=>g.multi?[]:(g.req?[0]:[]));let qty=1;
  const total=()=>{let p=priceFor(it,o.type);gs.forEach((g,gi)=>sel[gi].forEach(ci=>p+=addonPrice(g.choices[ci].p,o.type)));return p};
  const draw=()=>{
    sheet(`<div class="hd"><h2>${esc(it.name)}</h2><button class="btn sm" data-x>Close</button></div>
    <div class="bd">${gs.map((g,gi)=>`<div class="lbl" style="margin:8px 0 6px">${esc(g.name)} ${g.multi?"· choose any":g.req?"· choose one":"· optional"}</div>
      <div class="row">${g.choices.map((c,ci)=>`<button class="chip" data-g="${gi}" data-c="${ci}" aria-pressed="${sel[gi].includes(ci)}">${esc(c.n)}${+c.p?" +"+inr(addonPrice(c.p,o.type)):""}</button>`).join("")}</div>`).join("")}
      <div class="row" style="margin-top:14px"><span class="grow lbl">Quantity</span><div class="stp"><button id="oqm" aria-label="Less">−</button><span class="num" id="oqv">${qty}</span><button id="oqp" aria-label="More">+</button></div></div></div>
    <div class="ft"><button class="btn pri" id="oadd">Add ${qty>1?qty+" × ":""}${inr(total())}</button></div>`);
    $("#modal").querySelector(".bd").onclick=e=>{const b=e.target.closest("[data-g]");if(!b)return;const gi=+b.dataset.g,ci=+b.dataset.c,g=gs[gi];
      if(g.multi){const i=sel[gi].indexOf(ci);i>=0?sel[gi].splice(i,1):sel[gi].push(ci)}else sel[gi]=(sel[gi][0]===ci&&!g.req)?[]:[ci];draw()};
    $("#oqm").onclick=()=>{qty=Math.max(1,qty-1);draw()};$("#oqp").onclick=()=>{qty++;draw()};
    $("#oadd").onclick=()=>{const opts=[];let ab=0;gs.forEach((g,gi)=>sel[gi].forEach(ci=>{opts.push(g.choices[ci].n);ab+=+g.choices[ci].p}));
      closeSheet();addLine(it,qty,opts,ab)};
  };
  draw();
}
function addLine(it,qty,opts,addonBase){
  const o=curOrder();opts=opts||[];addonBase=addonBase||0;const key=opts.join("|");
  let l=o.lines.find(x=>x.iid===it.id&&!x.note&&(x.opts||[]).join("|")===key);
  if(l)l.qty+=qty;else o.lines.push({lid:uid(),iid:it.id,base:it.name,name:it.name+(opts.length?" ("+opts.join(", ")+")":""),opts,ab:addonBase,
    price:priceFor(it,o.type)+addonPrice(addonBase,o.type),qty,note:"",kot:0,cg:+it.chickenG||0,cost:+it.cost||0});
  persistCur();refreshCart();
}

function moveTable(){

  pickTable(n=>{o.table=n;persistCur();logA("Table moved","T"+from+" → T"+n+" · token "+o.token);
    if(o.kots)doPrint(["<H>TABLE MOVED","<C><B>TABLE "+from+"  >>  TABLE "+n,"<C>Token "+o.token+" · "+tfmt(Date.now()),dash()],"Move slip");
    else toast("Moved to table "+n);render()});
}
function mergeTable(){
  const o=curOrder();const others=runningOrders().filter(x=>x.type==="dine"&&x.id!==o.id);
  if(!others.length)return toast("No other running table to merge with");
  sheet(`<div class="hd"><h2>Merge table ${o.table} into…</h2><button class="btn sm" data-x>Cancel</button></div>
  <div class="bd"><div class="tgrid" id="mt">${others.map(x=>`<button class="tbl busy" data-id="${x.id}"><b>${x.table}</b><small class="num">${inr(calc(x).grand)}</small></button>`).join("")}</div>
  <p class="note">All items of table ${o.table} move to the table you pick. Table ${o.table} becomes free.</p></div>`);
  $("#mt").onclick=e=>{const b=e.target.closest("[data-id]");if(!b)return;const t=D.orders.find(x=>x.id===b.dataset.id);
    o.lines.forEach(l=>{const same=t.lines.find(x=>x.iid===l.iid&&!x.note&&!l.note&&(x.opts||[]).join("|")===(l.opts||[]).join("|")&&x.price===l.price);
      if(same){same.qty+=l.qty;same.kot+=l.kot}else t.lines.push(Object.assign({},l,{lid:uid()}))});
    if(o.note)t.note=[t.note,o.note].filter(Boolean).join(", ");t.kots=Math.max(t.kots||0,o.kots||0);
    D.orders=D.orders.filter(x=>x.id!==o.id);save("orders");logA("Tables merged","T"+o.table+" into T"+t.table);
    closeSheet();S.cur=t;toast("Table "+o.table+" merged into table "+t.table);render()};
}
function splitBill(){
  const o=curOrder();const take=o.lines.map(()=>0);
  const draw=()=>{const part={lines:o.lines.map((l,i)=>Object.assign({},l,{qty:take[i]})).filter(l=>l.qty),type:o.type,disc:null,charges:0};const c=calc(part);
    sheet(`<div class="hd"><h2>Split bill · table ${o.table}</h2><button class="btn sm" data-x>Cancel</button></div>
    <div class="bd"><p class="note" style="margin-top:0">Choose what this person pays for. The rest stays on the table.</p>

      if(b.dataset.p!=null){const i=+b.dataset.p;take[i]=Math.min(o.lines[i].qty,take[i]+1);draw()}

    $("#spall").onclick=()=>{o.lines.forEach((l,i)=>take[i]=l.qty);draw()};
    $("#sppay").onclick=()=>{

      const p=newOrder("dine",o.table);Object.assign(p,{token:o.token,kots:o.kots,created:o.created,cust:Object.assign({},o.cust),splitOf:o.id});
      o.lines.forEach((l,i)=>{if(!take[i])return;const k=Math.min(l.kot,take[i]);p.lines.push(Object.assign({},l,{lid:uid(),qty:take[i],kot:k}));l.qty-=take[i];l.kot-=k});

    };
  };
  draw();
}

const NOTES=[500,200,100,50,20,10];
function openShift(){return D.shifts.find(s=>!s.closeAt)}
function cashExpected(sh,until){
  until=until||Date.now()+1;let cashIn=0,cashExp=0,dueIn=0;
  D.orders.forEach(o=>{if(o.status==="paid"&&o.paidAt>=sh.openAt&&o.paidAt<until)(o.pay||[]).forEach(p=>{if(p.mode==="Cash")cashIn+=p.amt})});
  D.expenses.forEach(e=>{if(e.t>=sh.openAt&&e.t<until&&e.mode!=="UPI")cashExp+=+e.amt});
  Object.values(D.customers).forEach(c=>(c.payments||[]).forEach(p=>{if(p.t>=sh.openAt&&p.t<until&&p.mode==="Cash")dueIn+=p.amt}));
  return {open:+sh.openCash||0,cashIn:r2(cashIn),dueIn:r2(dueIn),cashExp:r2(cashExp),exp:r2((+sh.openCash||0)+cashIn+dueIn-cashExp)};
}

/* ---------- CLOUD SYNC (Firebase Firestore over REST) ----------
   Counter phone pushes every finished bill, expense, day close and the menu/settings.
   Owner phone ("viewer") pulls changes and shows the same dashboard. Nothing here blocks
   billing: if the internet is down, changes wait and go up later. */
const CLOUD_COLS=["bills","expenses","shifts","days","meta"];
let cloudTok="",cloudTokExp=0,cloudBusy=false,syncTimer=null;
const CL=()=>D.settings.cloud||(D.settings.cloud={apiKey:"",project:"",email:"",shop:"redchilli",role:"counter",refresh:"",lastSync:0,lastPull:{},err:"",errAt:0});
const cloudOn=()=>{const c=CL();return !!(c.apiKey&&c.project&&c.refresh)};
function h32(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)+":"+s.length}
let httpSeq=0;const httpWait={};
window.__httpCb=function(id,code,text){const w=httpWait[id];if(!w)return;delete httpWait[id];w({code,text})};
function http(method,url,body,opt){
  opt=opt||{};
  if(AB&&typeof AB.http==="function"){
    return new Promise(res=>{const id="h"+(++httpSeq);httpWait[id]=res;
      try{AB.http(id,method,url,opt.ct||"application/json",opt.auth||"",body||"")}catch(e){delete httpWait[id];res({code:0,text:String(e.message)})}
      setTimeout(()=>{if(httpWait[id]){delete httpWait[id];res({code:0,text:"Timed out"})}},45000)});
  }
  const h={"Content-Type":opt.ct||"application/json"};if(opt.auth)h.Authorization="Bearer "+opt.auth;
  return fetch(url,{method,headers:h,body:body||undefined}).then(r=>r.text().then(t=>({code:r.status,text:t}))).catch(e=>({code:0,text:e.message}));
}
function cloudErr(r){let m=r.text||"";try{const j=JSON.parse(m);m=(j.error&&(j.error.message||j.error.status))||m}catch(e){}
  if(r.code===0)return "No internet ("+m+")";
  if(/PERMISSION_DENIED|Missing or insufficient/i.test(m))return "Permission denied. Check the Firestore rules and the email.";
  if(/INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS|EMAIL_NOT_FOUND/i.test(m))return "Wrong email or password.";
  if(/API key not valid|API_KEY_INVALID/i.test(m))return "The Web API key is not correct.";
  if(/NOT_FOUND/i.test(m)&&/database/i.test(m))return "Firestore database not created yet.";
  return "Error "+r.code+": "+String(m).slice(0,140)}
async function cloudConnect(apiKey,project,email,password){
  const r=await http("POST","https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(apiKey),JSON.stringify({email,password,returnSecureToken:true}));
  if(r.code!==200)throw new Error(cloudErr(r));
  const j=JSON.parse(r.text);const c=CL();Object.assign(c,{apiKey,project,email,refresh:j.refreshToken,err:"",errAt:0});
  cloudTok=j.idToken;cloudTokExp=Date.now()+(+j.expiresIn||3600)*1000;save("settings");
}
async function cloudToken(){
  if(cloudTok&&cloudTokExp>Date.now()+60e3)return cloudTok;
  const c=CL();
  const r=await http("POST","https://securetoken.googleapis.com/v1/token?key="+encodeURIComponent(c.apiKey),"grant_type=refresh_token&refresh_token="+encodeURIComponent(c.refresh),{ct:"application/x-www-form-urlencoded"});
  if(r.code!==200)throw new Error(cloudErr(r));
  const j=JSON.parse(r.text);cloudTok=j.id_token;cloudTokExp=Date.now()+(+j.expires_in||3600)*1000;
  if(j.refresh_token&&j.refresh_token!==c.refresh){c.refresh=j.refresh_token;save("settings")}
  return cloudTok;
}
const docBase=()=>{const c=CL();return "projects/"+c.project+"/databases/(default)/documents/shops/"+(c.shop||"redchilli")};
const FS="https://firestore.googleapis.com/v1/";
function configDoc(){
  const st=Object.assign({},D.settings);["cloud","printer","printerName","lastAuto","theme"].forEach(k=>delete st[k]);
  return {settings:st,cats:D.cats,items:D.items,addons:D.addons,staff:D.staff,stock:D.stock,customers:D.customers,stockLog:D.stockLog.slice(-300),audit:D.audit.slice(-400)};
}
function cloudSnapshot(){
  const m={bills:{},expenses:{},shifts:{},days:{},meta:{}};
  D.orders.forEach(o=>{if(o.status!=="open"&&!o.demo)m.bills[o.id]=JSON.stringify(o)});
  D.expenses.forEach(e=>{if(!e.demo)m.expenses[e.id]=JSON.stringify(e)});
  D.shifts.forEach(s=>m.shifts[s.id]=JSON.stringify(s));
  Object.values(D.daySum).forEach(d=>m.days[d.d]=JSON.stringify(d));
  m.meta.config=JSON.stringify(configDoc());
  return m;
}
function syncSent(){return store.get("syncSent",{bills:{},expenses:{},shifts:{},days:{},meta:{}})}
function cloudPending(){
  if(!cloudOn()||CL().role!=="counter")return 0;
  const sent=syncSent(),m=cloudSnapshot();let n=0;
  CLOUD_COLS.forEach(c=>{const s=sent[c]||{};Object.entries(m[c]).forEach(([id,j])=>{if(s[id]!==h32(j))n++});Object.keys(s).forEach(id=>{if(!(id in m[c]))n++})});
  return n;
}
function forgetArchived(ids){const s=syncSent();ids.forEach(id=>delete s.bills[id]);store.set("syncSent",s)}
async function cloudPush(){
  const c=CL();if(!cloudOn()||c.role!=="counter")return 0;
  const tok=await cloudToken();const sent=syncSent();const m=cloudSnapshot();const now=Date.now();
  const writes=[];const marks=[];
  CLOUD_COLS.forEach(col=>{const s=sent[col]||(sent[col]={});
    Object.entries(m[col]).forEach(([id,j])=>{const h=h32(j);if(s[id]!==h){writes.push({update:{name:docBase()+"/"+col+"/"+id,fields:{j:{stringValue:j},u:{integerValue:String(now)}}}});marks.push([col,id,h])}});
    Object.keys(s).forEach(id=>{if(!(id in m[col])){writes.push({update:{name:docBase()+"/"+col+"/"+id,fields:{x:{booleanValue:true},u:{integerValue:String(now)}}}});marks.push([col,id,null])}})});
  for(let i=0;i<writes.length;i+=300){
    const r=await http("POST",FS+"projects/"+c.project+"/databases/(default)/documents:commit",JSON.stringify({writes:writes.slice(i,i+300)}),{auth:tok});
    if(r.code!==200)throw new Error(cloudErr(r));
    marks.slice(i,i+300).forEach(([col,id,h])=>{if(h)sent[col][id]=h;else delete sent[col][id]});
    store.set("syncSent",sent);
  }
  return writes.length;
}
async function cloudPull(all){
  const c=CL();const tok=await cloudToken();c.lastPull=c.lastPull||{};let got=0;
  for(const col of CLOUD_COLS){
    let since=all?0:(c.lastPull[col]||0);
    for(let page=0;page<60;page++){
      const q={structuredQuery:{from:[{collectionId:col}],where:{fieldFilter:{field:{fieldPath:"u"},op:"GREATER_THAN",value:{integerValue:String(since)}}},orderBy:[{field:{fieldPath:"u"},direction:"ASCENDING"}],limit:400}};
      const r=await http("POST",FS+docBase()+":runQuery",JSON.stringify(q),{auth:tok});
      if(r.code!==200)throw new Error(cloudErr(r));
      const rows=JSON.parse(r.text).filter(x=>x.document);
      rows.forEach(x=>{const f=x.document.fields||{};const id=x.document.name.split("/").pop();const u=+(f.u&&f.u.integerValue)||0;if(u>since)since=u;
        const del=f.x&&f.x.booleanValue;let v=null;if(!del&&f.j){try{v=JSON.parse(f.j.stringValue)}catch(e){}}cloudApply(col,id,v);got++});
      c.lastPull[col]=since;
      if(rows.length<400)break;
    }
  }
  save("orders","expenses","shifts","daySum","settings");
  return got;
}
function cloudApply(col,id,v){
  const up=(arr,key)=>{const i=arr.findIndex(x=>x[key]===id);if(!v){if(i>=0)arr.splice(i,1)}else if(i>=0)arr[i]=v;else arr.push(v)};
  if(col==="bills")up(D.orders,"id");
  else if(col==="expenses")up(D.expenses,"id");
  else if(col==="shifts")up(D.shifts,"id");
  else if(col==="days"){if(v)D.daySum[id]=v;else delete D.daySum[id]}
  else if(col==="meta"&&id==="config"&&v){
    const keep={cloud:D.settings.cloud,printer:D.settings.printer,printerName:D.settings.printerName,lastAuto:D.settings.lastAuto,theme:D.settings.theme};
    D.settings=Object.assign({},DEF_SETTINGS,v.settings||{},keep);
    ["cats","items","addons","staff","stock","customers","stockLog","audit"].forEach(k=>{if(v[k]!=null)D[k]=v[k]});
    save("cats","items","addons","staff","stock","customers","stockLog","audit");store.set("menuVer",MENU_VER);
  }
}
async function cloudSync(manual){
  if(!cloudOn()||cloudBusy)return;cloudBusy=true;const c=CL();
  try{
    let n=0;
    if(c.role==="counter"){
      if(!hqStores().some(s=>s.code===c.shop))throw new Error("Choose which store this tab belongs to (More › Cloud sync).");
      n=await cloudPush();await hqPullCounter();await publishPublic();
    }else n=await hqPullAll();
    c.lastSync=Date.now();c.err="";save("settings");
    if(manual)toast(c.role==="counter"?(n?"Uploaded "+n+" changes":"Cloud is up to date"):(n?"Downloaded "+n+" changes":"Already up to date"));
    if(c.role!=="counter"&&n&&!$("#ov"))render();
  }catch(e){c.err=e.message;c.errAt=Date.now();save("settings");if(manual)toast(e.message)}
  finally{cloudBusy=false;if(S.tab==="more"&&S.more==="cloud"&&!$("#ov"))render()}
}
function scheduleSync(){if(!cloudOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>cloudSync(false),6000)}
function cloudStatusLine(){

/* ---------- MULTI-STORE ----------
   Each counter uploads under shops/<store code>. The owner phone (Owner view) downloads every
   store into a compact cache and the dashboard can show one store or all stores together.
   shops/_hq/meta holds the store list and, when switched on, the central menu with store prices. */
const DEF_STORES=[

  {code:"vlk",name:"Velankanni",prefix:"VLK"},
  {code:"kks",name:"Karaikal Kamarajar Salai",prefix:"KKS"},
  {code:"kmr",name:"Karaikal Marina",prefix:"KMR"}];
const HQ_KEEP_DAYS=2;
function hqData(){return store.get("hqData",{stores:null,menu:null,lastPull:0})}
function hqStores(){const h=hqData();return (h.stores&&h.stores.length?h.stores:DEF_STORES)}
const storeName=code=>{const s=hqStores().find(x=>x.code===code);return s?s.name:code};
const isOwnerMulti=()=>cloudOn()&&CL().role==="viewer";
function hqCache(code){return store.get("hq_"+code,{orders:[],expenses:[],shifts:[],daySum:{},config:null,lastPull:{}})}
function hqCacheSave(code,c){store.set("hq_"+code,c)}
async function hqWrite(id,obj){
  const c=CL();const tok=await cloudToken();
  const w=[{update:{name:"projects/"+c.project+"/databases/(default)/documents/shops/_hq/meta/"+id,fields:{j:{stringValue:JSON.stringify(obj)},u:{integerValue:String(Date.now())}}}}];
  const r=await http("POST",FS+"projects/"+c.project+"/databases/(default)/documents:commit",JSON.stringify({writes:w}),{auth:tok});
  if(r.code!==200)throw new Error(cloudErr(r));
}
async function runQ(parent,col,since,limit){
  const c=CL();const tok=await cloudToken();
  const q={structuredQuery:{from:[{collectionId:col}],where:{fieldFilter:{field:{fieldPath:"u"},op:"GREATER_THAN",value:{integerValue:String(since)}}},orderBy:[{field:{fieldPath:"u"},direction:"ASCENDING"}],limit:limit||400}};
  const r=await http("POST",FS+"projects/"+c.project+"/databases/(default)/documents/"+parent+":runQuery",JSON.stringify(q),{auth:tok});
  if(r.code!==200)throw new Error(cloudErr(r));
  return JSON.parse(r.text).filter(x=>x.document).map(x=>{const f=x.document.fields||{};let v=null;if(!(f.x&&f.x.booleanValue)&&f.j){try{v=JSON.parse(f.j.stringValue)}catch(e){}}
    return {id:x.document.name.split("/").pop(),u:+(f.u&&f.u.integerValue)||0,v}});
}
/* HQ docs: store list + central menu. Both phones read them. */
async function hqPullMeta(){

  rows.forEach(r=>{if(r.id==="stores"&&r.v)h.stores=r.v;if(r.id==="menu")h.menu=r.v;if(r.u>(h.lastPull||0))h.lastPull=r.u});

/* Owner phone: download every store into its own compact cache */
function cacheArchive(cache){
  const cut=sod(Date.now())-HQ_KEEP_DAYS*864e5;const keep=[];
  cache.orders.forEach(o=>{const t=o.paidAt||o.voidAt||o.created;
    if(o.status!=="open"&&t<cut){const k=dkey(t);const d=cache.daySum[k]||(cache.daySum[k]=emptyDay(k));if(d.src!=="cloud")withCtx(null,()=>addOrderToDay(d,o),cache)}else keep.push(o)});
  cache.orders=keep;
}
async function hqPullAll(){
  await hqPullMeta();let got=0;
  for(const s of hqStores()){
    const cache=hqCache(s.code);
    for(const col of CLOUD_COLS){
      let since=cache.lastPull[col]||0;
      for(let page=0;page<40;page++){
        const rows=await runQ("shops/"+s.code,col,since,400);
        rows.forEach(r=>{if(r.u>since)since=r.u;got++;const v=r.v;
          const up=(arr)=>{const i=arr.findIndex(x=>x.id===r.id);if(!v){if(i>=0)arr.splice(i,1)}else if(i>=0)arr[i]=v;else arr.push(v)};
          if(col==="bills")up(cache.orders);else if(col==="expenses")up(cache.expenses);else if(col==="shifts")up(cache.shifts);
          else if(col==="days"){if(v){v.src="cloud";cache.daySum[r.id]=v}else delete cache.daySum[r.id]}
          else if(col==="meta"&&r.id==="config"&&v){cache.config={items:v.items,cats:v.cats,settings:v.settings}}});
        cache.lastPull[col]=since;if(rows.length<400)break;
      }
    }
    cacheArchive(cache);hqCacheSave(s.code,cache);
  }
  const h=hqData();
  if(h.menu&&h.menu.items&&(h.menu.at||0)>=store.get("hqMenuLocalAt",0)&&!hqMenuTimer){D.items=h.menu.items.map(i=>Object.assign({},i));D.cats=h.menu.cats.slice();if(h.menu.addons)D.addons=h.menu.addons;save("items","cats","addons")}
  return got;
}
/* Run fn with D pointed at one store's cached data (owner phone) */
function withCtx(code,fn,cacheObj){
  const c=cacheObj||hqCache(code);const keep={orders:D.orders,expenses:D.expenses,daySum:D.daySum,items:D.items,shifts:D.shifts,settings:D.settings};
  D.orders=c.orders;D.expenses=c.expenses;D.daySum=c.daySum;D.shifts=c.shifts;
  if(c.config&&c.config.items)D.items=c.config.items;
  if(c.config&&c.config.settings)D.settings=Object.assign({},D.settings,{swiggyComm:c.config.settings.swiggyComm,zomatoComm:c.config.settings.zomatoComm});
  try{return fn()}finally{Object.assign(D,keep)}
}
function reportData(a,b){
  if(!isOwnerMulti())return reportDataCore(a,b);
  const codes=S.store&&S.store!=="all"?[S.store]:hqStores().map(s=>s.code);
  const multi=codes.length>1;
  const Rs=codes.map(code=>withCtx(code,()=>{const r=reportDataCore(a,b);r.store=code;
    r.cashDiff=r2(D.shifts.filter(s=>s.closeAt&&s.closeAt>=a&&s.closeAt<b).reduce((x,s)=>x+(+s.diff||0),0));
    if(multi){const bs={};Object.entries(r.byStaff).forEach(([n,v])=>bs[n+" ("+(hqStores().find(s=>s.code===code)||{prefix:code}).prefix+")"]=v);r.byStaff=bs}
    return r}));
  return multi?mergeR(Rs):Rs[0];
}
function mergeR(Rs){
  const M={a:Rs[0].a,b:Rs[0].b,perStore:Rs,list:[],days:{},dowDays:Rs[0].dowDays,nDays:Rs[0].nDays,slots:SLOTS.map(()=>[0,0]),veg:[0,0],nonveg:[0,0],items:{},cashDiff:0};
  const N=["bills","gross","disc","tax","net","chg","cost","costAmt","voids","voidAmt","exp","chickenKg","salesEx","comm","profit","cashDiff"];
  const NM=["byMode","byType","typeBills","hours","hourBills","dow","dowBills","expByCat"],PM=["byStaff","cats"];
  N.forEach(k=>M[k]=0);NM.forEach(k=>M[k]={});PM.forEach(k=>M[k]={});
  Rs.forEach(r=>{N.forEach(k=>M[k]=r2(M[k]+(+r[k]||0)));
    NM.forEach(k=>Object.entries(r[k]||{}).forEach(([x,v])=>M[k][x]=r2((M[k][x]||0)+v)));
    PM.forEach(k=>Object.entries(r[k]||{}).forEach(([x,v])=>{const t=M[k][x]||(M[k][x]=[0,0]);t[0]+=v[0];t[1]=r2(t[1]+v[1])}));
    r.slots.forEach((s,i)=>{M.slots[i][0]+=s[0];M.slots[i][1]=r2(M.slots[i][1]+s[1])});
    M.veg[0]+=r.veg[0];M.veg[1]+=r.veg[1];M.nonveg[0]+=r.nonveg[0];M.nonveg[1]+=r.nonveg[1];
    Object.entries(r.items).forEach(([n,x])=>{const t=M.items[n]||(M.items[n]={q:0,amt:0,cost:0,cat:x.cat,veg:x.veg});t.q+=x.q;t.amt+=x.amt;t.cost+=x.cost});
    Object.entries(r.days).forEach(([k,d])=>{const t=M.days[k]||(M.days[k]={d:k,net:0});t.net=r2(t.net+d.net)});
    M.list=M.list.concat(r.list)});
  return M;
}
