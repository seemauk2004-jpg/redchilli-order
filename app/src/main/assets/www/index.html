}

function setStore(code,quiet){
  const c=CL();const st=hqStores().find(s=>s.code===code);if(!st)return;
  const changed=c.shop!==code;c.shop=code;
  if(changed){store.set("syncSent",{bills:{},expenses:{},shifts:{},days:{},meta:{}});
    const prefixes=hqStores().map(s=>s.prefix);if(D.settings.billPrefix==="RC"||prefixes.includes(D.settings.billPrefix))D.settings.billPrefix=st.prefix;
    if(!/–|-/.test(D.settings.shop))D.settings.shop="Red Chilli – "+st.name;
    logA("Store set",st.name);if(!quiet)toast("This tab is now "+st.name+". Check the address in Settings.")}
  save("settings");
}
window.scheduleSync=scheduleSync;window.scheduleHqMenu=scheduleHqMenu;
/* ---------- WEBSITE ORDERS ----------
   Each store tab publishes its menu, prices, sold-out items and timings to public/<store>.
   Customers order on the website into online/<store>/orders. The tab checks every 30 s,
   rings, and the cashier accepts (becomes a normal order + KOT) or rejects. */
const WEB_DEF={on:true,pickup:true,delivery:true,dchg:30,min:150,area:"within 5 km",open:"11:00",close:"23:00"};
const WEB=()=>Object.assign({},WEB_DEF,D.settings.web||{});
let webPending=[],webSeen=new Set(store.get("webSeen",[])),webBusy=false;
const webStoreOK=()=>cloudOn()&&CL().role==="counter"&&hqStores().some(s=>s.code===CL().shop);
function publicDoc(){
  const code=CL().shop;const st=Object.assign({},D.settings);
  return {code,name:storeName(code),shop:st.shop,addr:st.addr,phone:st.phone,web:WEB(),cats:D.cats,
    items:D.items.map(i=>({id:i.id,name:i.name,cat:i.cat,price:+i.price,veg:!!i.veg,avail:!!i.avail,img:i.img||""})),
    addons:(D.addons||[]).map(g=>({name:g.name,multi:g.multi,req:g.req,cats:g.cats,choices:g.choices}))};
}
async function publishPublic(){
  if(!webStoreOK())return;
  const doc=publicDoc();const j=JSON.stringify(doc);const h=h32(j);
  if(store.get("pubHash","")===h+CL().shop)return;
  const c=CL();const tok=await cloudToken();
  const r=await http("POST",FS+"projects/"+c.project+"/databases/(default)/documents:commit",JSON.stringify({writes:[{update:{name:"projects/"+c.project+"/databases/(default)/documents/public/"+c.shop,fields:{j:{stringValue:j},u:{integerValue:String(Date.now())}}}}]}),{auth:tok});
  if(r.code!==200)throw new Error(cloudErr(r));
  store.set("pubHash",h+c.shop);
}
async function webSetStatus(code,id,orig,st,extra){
  const c=CL();const tok=await cloudToken();const o=Object.assign({},orig,extra||{},{status:st});
  const r=await http("POST",FS+"projects/"+c.project+"/databases/(default)/documents:commit",JSON.stringify({writes:[{update:{name:"projects/"+c.project+"/databases/(default)/documents/online/"+code+"/orders/"+id,
    fields:{j:{stringValue:JSON.stringify(o)},st:{stringValue:st},u:{integerValue:String(Date.now())},t:{integerValue:String(orig.t||Date.now())}}}}]}),{auth:tok});
  if(r.code!==200)throw new Error(cloudErr(r));
  return o;
}
async function pollOnline(manual){
  if(!webStoreOK()||!WEB().on||webBusy)return;webBusy=true;
  try{
    const c=CL();const tok=await cloudToken();
    const q={structuredQuery:{from:[{collectionId:"orders"}],where:{fieldFilter:{field:{fieldPath:"st"},op:"EQUAL",value:{stringValue:"new"}}},limit:50}};
    const r=await http("POST",FS+"projects/"+c.project+"/databases/(default)/documents/online/"+c.shop+":runQuery",JSON.stringify(q),{auth:tok});
    if(r.code!==200)throw new Error(cloudErr(r));
    const list=JSON.parse(r.text).filter(x=>x.document).map(x=>{try{return JSON.parse(x.document.fields.j.stringValue)}catch(e){return null}}).filter(Boolean).sort((a,b)=>a.t-b.t);
    const fresh=list.filter(o=>!webSeen.has(o.id));
    webPending=list;
    if(fresh.length){fresh.forEach(o=>webSeen.add(o.id));store.set("webSeen",[...webSeen].slice(-300));ring();toast(fresh.length+" new online order"+(fresh.length>1?"s":""));if(!$("#ov"))render()}
    renderWebChip();
    if(manual)toast(list.length?list.length+" waiting":"No new online orders");
  }catch(e){if(manual)toast(e.message)}
  finally{webBusy=false}
}
let actx=null;
function ring(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
    [0,0.28,0.56].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=d===0.28?1320:990;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.22);o.connect(g).connect(actx.destination);o.start(t+d);o.stop(t+d+.24)})}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
}
function renderWebChip(){
  const c=$("#webchip");if(!c)return;const n=webPending.length;
  c.hidden=!n;c.innerHTML=`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13v8H3zM16 10h3l2 3v2h-5"/><circle cx="7" cy="17" r="1.8"/><circle cx="17.5" cy="17" r="1.8"/></svg>Online ${n}`;
}
function webBanner(){const n=webPending.length;return n?`<div class="dayban warn"><span class="grow"><b>${n} online order${n>1?"s":""} waiting.</b> Accept quickly so the customer knows.</span><button class="btn sm dark" id="webopen">View</button></div>`:""}
function webInbox(){
  if(!webPending.length){toast("No online orders waiting");return}
  const ago=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?"just now":m+" min ago"};
  sheet(`<div class="hd"><h2>Online orders</h2><button class="btn sm" data-x>Close</button></div>
  <div class="bd">${webPending.map(o=>`<div class="card" style="margin-bottom:10px">
    <div class="row"><b class="grow" style="font-size:17px">${esc(o.name)} · <span class="num">${esc(o.phone)}</span></b><span class="pill run">${o.mode==="delivery"?"Delivery":"Pickup"}</span></div>
    <div class="note">${ago(o.t)} · order ${esc(o.id.slice(-5).toUpperCase())} · pays by ${o.pay==="upi"?"UPI":"cash"}</div>
    ${o.mode==="delivery"?`<div style="margin-top:4px"><b>Address:</b> ${esc(o.addr)}</div>`:""}
    <div class="sums num" style="padding-top:6px">${o.lines.map(l=>`<div><span>${l.qty} × ${esc(l.name)}${l.opts&&l.opts.length?" ("+esc(l.opts.join(", "))+")":""}</span><span>${inr(l.price*l.qty)}</span></div>`).join("")}
      ${o.dchg?`<div><span>Delivery</span><span>${inr(o.dchg)}</span></div>`:""}<div style="font-weight:800"><span>Total</span><span>${inr(o.total)}</span></div></div>
    ${o.note?`<p class="warnbox" style="margin:6px 0 0">Note: ${esc(o.note)}</p>`:""}
    <div class="row" style="margin-top:10px;flex-wrap:nowrap"><button class="btn grow danger" data-rej="${o.id}">Reject</button><button class="btn ok grow" data-acc="${o.id}" style="flex:2">Accept &amp; send KOT</button></div></div>`).join("")}</div>`);
  $("#modal").querySelector(".bd").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    const o=webPending.find(x=>x.id===(b.dataset.acc||b.dataset.rej));if(!o)return;
    if(b.dataset.acc)return webAccept(o);
    webReject(o)};
}
async function webAccept(o){
  const code=CL().shop;
  const ord=newOrder("web");ord.webId=o.id;ord.web=o;ord.webMode=o.mode;ord.cust={name:o.name,phone:o.phone,addr:o.addr||""};ord.note=[o.mode==="delivery"?"DELIVERY":"PICKUP",o.note].filter(Boolean).join(" · ");
  ord.charges=+o.dchg||0;
  const diffs=[];
  o.lines.forEach(l=>{const it=D.items.find(i=>i.id===l.id)||D.items.find(i=>i.name===l.name);
    let ab=0;if(it&&l.opts&&l.opts.length)groupsFor(it).forEach(g=>g.choices.forEach(c=>{if(l.opts.includes(c.n))ab+=+c.p||0}));
    const price=it?(+it.price+ab):+l.price;if(it&&price!==+l.price)diffs.push(l.name);
    ord.lines.push({lid:uid(),iid:it?it.id:l.id,base:it?it.name:l.name,name:l.name+(l.opts&&l.opts.length?" ("+l.opts.join(", ")+")":""),opts:l.opts||[],ab,price,qty:l.qty,note:"",kot:0,cg:it?+it.chickenG||0:0,cost:it?+it.cost||0:0})});
  ord.token=nextToken();D.orders.push(ord);save("orders");
  try{const upd=await webSetStatus(code,o.id,o,"accepted",{token:ord.token});ord.web=upd;save("orders")}
  catch(e){toast("Accepted here, but the customer was not updated: "+e.message)}
  webPending=webPending.filter(x=>x.id!==o.id);renderWebChip();closeSheet();
  logA("Online order accepted",o.name+" · "+inr(o.total)+" · token "+ord.token);
  if(diffs.length)setTimeout(()=>toast("Price changed since the customer ordered: "+diffs.join(", ")),2600);
  S.cur=ord;sendKOT(ord);go("bill");
}
function webReject(o){
  sheet(`<div class="hd"><h2>Reject order</h2><button class="btn sm" data-x>Back</button></div>
  <div class="bd"><p class="note" style="margin-top:0">${esc(o.name)} will see this message on the website.</p>
  <div class="row" id="rq">${["Item not available","Too busy right now","Outside delivery area","Closing now"].map(x=>`<button class="btn sm" data-r="${x}">${x}</button>`).join("")}</div>
  <div class="fld" style="margin-top:10px"><label for="rmsg">Message</label><input class="inp" id="rmsg" value="Item not available"></div></div>
  <div class="ft"><button class="btn pri" id="rok">Reject order</button></div>`);
  $("#rq").onclick=e=>{const b=e.target.closest("[data-r]");if(b)$("#rmsg").value=b.dataset.r};
  $("#rok").onclick=async()=>{const msg=$("#rmsg").value.trim()||"The shop could not take this order.";
    try{await webSetStatus(CL().shop,o.id,o,"rejected",{msg});webPending=webPending.filter(x=>x.id!==o.id);renderWebChip();logA("Online order rejected",o.name+" · "+msg);closeSheet();toast("Order rejected");render()}
    catch(e){toast(e.message)}};
}
async function webMark(o,st){
  if(!o||!o.webId||!cloudOn())return;
  try{o.web=await webSetStatus(CL().shop,o.webId,o.web||{t:o.created},st,st==="ready"?{}:{});save("orders")}catch(e){toast("Customer not updated: "+e.message)}
}
function renderOnlineSettings(){
  const w=WEB();
  return `<h3>Online ordering (website)</h3>
  <div class="card"><div class="row"><span class="grow">Take orders from the website</span><label class="sw"><input type="checkbox" id="w_on" ${w.on?"checked":""}><i></i></label></div>
  <div class="row" style="margin-top:10px"><span class="grow">Pickup</span><label class="sw"><input type="checkbox" id="w_pickup" ${w.pickup?"checked":""}><i></i></label></div>
  <div class="row" style="margin-top:10px"><span class="grow">Delivery</span><label class="sw"><input type="checkbox" id="w_delivery" ${w.delivery?"checked":""}><i></i></label></div></div>
  <div class="two" style="margin-top:10px"><div class="fld"><label for="w_open">Opens at</label><input class="inp" id="w_open" type="time" value="${esc(w.open)}"></div><div class="fld"><label for="w_close">Closes at</label><input class="inp" id="w_close" type="time" value="${esc(w.close)}"></div></div>
  <div class="two"><div class="fld"><label for="w_dchg">Delivery charge ₹</label><input class="inp num" id="w_dchg" type="number" value="${w.dchg}"></div><div class="fld"><label for="w_min">Minimum order for delivery ₹</label><input class="inp num" id="w_min" type="number" value="${w.min}"></div></div>
  <div class="fld"><label for="w_area">Delivery area (shown to customers)</label><input class="inp" id="w_area" value="${esc(w.area)}"></div>
  <p class="note">Needs Cloud sync on this tab. The website shows this store's menu, prices and sold-out items within 2 minutes of a change.</p>`;
}
function readOnlineSettings(){
  D.settings.web={on:$("#w_on").checked,pickup:$("#w_pickup").checked,delivery:$("#w_delivery").checked,open:$("#w_open").value||"11:00",close:$("#w_close").value||"23:00",
    dchg:Math.max(0,+$("#w_dchg").value||0),min:Math.max(0,+$("#w_min").value||0),area:$("#w_area").value.trim()};
}

/* ---------- boot ---------- */
function tick(){$("#clock").textContent=new Date().toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"})}
if(!D.addons){D.addons=JSON.parse(JSON.stringify(DEF_ADDONS));save("addons")}
if(!D.staff.length&&D.settings.pin){D.staff=[{id:uid(),name:"Owner",role:"owner",pin:D.settings.pin}];D.settings.pin="";save("staff","settings")}
archiveOld();
tick();setInterval(tick,15000);
$("#userchip").onclick=switchUser;$("#webchip").onclick=webInbox;
setInterval(()=>{if(!document.hidden)pollOnline(false)},30000);setTimeout(()=>pollOnline(false),5000);
window.onAndroidBack=function(){ if($("#ov")){if(!modalLock)closeSheet();return true} if(S.tab==="more"&&S.more){go("more");return true} if(S.tab!=="bill"){go("bill");return true} return false };
window.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#ov")&&!modalLock)closeSheet()});
render();
if(D.staff.length)showLogin();else checkDay();
setInterval(()=>{if(!cloudOn()||document.hidden)return;if(CL().role==="viewer"&&Date.now()-(CL().lastSync||0)<290000)return;cloudSync(false)},120000);
setTimeout(()=>cloudSync(false),2500);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&cloudOn()&&CL().role==="viewer")cloudSync(false)});
if((!D.settings.lastAuto||dkey(D.settings.lastAuto)!==dkey(Date.now()))&&D.orders.length)setTimeout(autoBackup,4000);
